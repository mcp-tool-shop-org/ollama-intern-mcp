# --- Measured CI cost (dogfood-swarm SKILL item 8) --------------------------
# 11 billable min per push across 8 jobs (3.7 min actual wall time),
# measured 2026-09-07 from run 34122815694. Most expensive jobs:
#     4 min  verify (windows-latest, 20)  (1.2 min wall, x2 runner)
#     2 min  verify (windows-latest, 22)  (0.7 min wall, x2 runner)
#     1 min  audit  (0.2 min wall)
# GitHub bills per JOB, rounded UP to the minute, x2 Windows / x10 macOS, so
# billable minutes exceed wall time — many short jobs cost more than one long
# one. This number is measured, never estimated; re-measure after any change:
#   gh api repos/mcp-tool-shop-org/ollama-intern-mcp/actions/runs/<id>/jobs
#
# STALE as of 2026-09-11: the tarball install-and-run smoke (F-c32cff48) was
# added to the EXISTING lockfile-sync job — no new job, no new workflow, no
# second suite run. Measured ~40s locally (pack 5s / install 15s / four CLI
# runs 5s). Billing rounds UP per job, so the realistic delta is 0-1 billable
# minutes on one ubuntu job. Re-measure with the command above and replace
# this paragraph with the real figure.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "src/**"
      - "tests/**"
      - "scripts/gen-tool-docs.mjs"
      - "scripts/sync-doc-versions.mjs"
      - "site/src/content/docs/handbook/tools.md"
      - "site/src/content/docs/handbook/tools/**"
      - ".github/workflows/**"
      - ".npmignore"
      - "hermes.config.example.yaml"
      - "Dockerfile"
      - ".dockerignore"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "src/**"
      - "tests/**"
      - "scripts/gen-tool-docs.mjs"
      - "scripts/sync-doc-versions.mjs"
      - "site/src/content/docs/handbook/tools.md"
      - "site/src/content/docs/handbook/tools/**"
      - ".github/workflows/**"
      - ".npmignore"
      - "hermes.config.example.yaml"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      run_generate:
        description: "Cloud smoke: also run one REAL cloud generate (consumes a tiny amount of cloud GPU time). Off = doctor reachability probe only (zero GPU)."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Cross-OS matrix. Stage A surfaced Windows-specific bugs in the
    # primitives (shell-injection vector in batchProofCheck, path-with-spaces
    # handling in compileCheck, case-insensitivity bypass in protectedPaths)
    # that Linux-only CI would never catch. fail-fast: false ensures one OS's
    # flake doesn't mask another OS's real failure.
    #
    # macOS REMOVED 2026-09-07 under the studio Actions rule ("never
    # macos-latest unless explicitly requested"), and this is the one removal
    # in the sweep that overrode a STATED rationale, so the reasoning is
    # recorded rather than the cell just deleted. The old comment justified the
    # cell with "the M5 Max profile is a documented first-class target" -- true,
    # and unchanged. What the cell could not do is verify it: a hosted
    # macos-latest runner is not an M5 Max, and every bug the matrix has
    # actually caught was Windows-specific (the three named above). Measured on
    # September org billing, macOS bills at ~10x Linux per minute and this
    # repo's 12 macOS minutes cost more gross than its 21 Windows minutes.
    # The 6-cell matrix is now 4, inside the studio job cap with room to spare.
    #
    # If macOS parity needs a real gate, the M5 Max itself is the runner that
    # would prove it -- not a hosted cell that shares only the OS name.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      # Fail loudly if the runner somehow booted with a Node version outside
      # our supported range. engines.node is ">=20.0.0"; the matrix pins 20
      # and 22. Anything else means setup-node drifted and tests would give
      # misleading signal.
      - name: Assert Node major version (20.x or 22.x)
        shell: bash
        run: |
          NODE_V="$(node --version)"
          echo "node --version: $NODE_V"
          case "$NODE_V" in
            v20.*|v22.*) echo "ok" ;;
            *) echo "::error::Unsupported Node version: $NODE_V (want v20.x or v22.x)"; exit 1 ;;
          esac
      # Was `rm -f package-lock.json && npm install`. That deleted the committed
      # lockfile and re-resolved from scratch, so CI never actually validated the
      # tree this repo ships -- and on npm 11 (bundled with newer Node 22 images)
      # the fresh resolve crashed arborist outright:
      #   npm error Cannot read properties of null (reading 'edgesOut')
      # The workaround predates lockfiles recording cross-platform optional deps.
      # This one already does: 27 entries across android/darwin/freebsd/linux/
      # win32, so `npm ci` installs the right binaries on every runner.
      - name: Install (npm ci, from the committed lockfile)
        shell: bash
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != '20'
        run: npm test
      # ubuntu/20 is the single cell that records the pass count for
      # sync-docs:check. pipefail means a failing suite fails this step
      # before any count is parsed — never a partial 'N passed' (F-f613f553).
      #
      # The marker gate is a SEPARATE step that consumes this step's output, so
      # it still runs against THIS run's count and never spawns a second suite
      # (F-7df86b73). Splitting them is what makes the failure legible: these
      # are three distinct failure modes (suite red / count unparseable /
      # doc marker drifted) and one step name could describe none of them — a
      # doc-only drift used to render in the PR checks list as
      # "CI / verify (ubuntu-latest, 20)", which reads as a Node-20 test
      # failure.
      - name: Run tests (ubuntu/20 — records the pass count)
        id: pass-count
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        shell: bash
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -euo pipefail
          # Full treatment Phase 4b: coverage rides on the cell that ALREADY
          # runs the suite for the count parser — `test:coverage` is
          # `vitest run --coverage`, the same single run, so this adds no
          # second full-suite execution (the standing CI-minute rule). The
          # count parser below was verified against coverage output before
          # this swap: the `Tests N passed` line is unchanged.
          npm run test:coverage 2>&1 | tee test-output.txt
          CLEAN="$(sed -E 's/\x1b\[[0-9;]*m//g' test-output.txt)"
          PASSED="$(printf '%s\n' "$CLEAN" | grep -E "^\s*Tests\s+" | tail -1 | sed -E 's/.*\b([0-9]+)\s+passed.*/\1/' || true)"
          if [ -z "$PASSED" ]; then
            echo "::error::Could not parse passing-test count from vitest output."
            exit 1
          fi
          echo "Resolved passing test count: $PASSED"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
      # The script emits one '::error file=…::<MARKER> says X, source of truth
      # says Y' per drifted marker, so the drift lands in the run's annotation
      # list and the PR Files-changed view — the same treatment doc-drift.yml
      # Checks 1-3 already get. Reads the count via env (not a `${{ }}` splice
      # into the shell body), matching doc-drift.yml's steps.pkg idiom.
      - name: Doc markers in sync (sync-docs:check)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        shell: bash
        env:
          PASSED: ${{ steps.pass-count.outputs.passed }}
        run: |
          set -euo pipefail
          node scripts/sync-doc-versions.mjs --check --test-count="$PASSED"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: "npm"
      - name: Assert Node major version (20.x or 22.x)
        run: |
          NODE_V="$(node --version)"
          echo "node --version: $NODE_V"
          case "$NODE_V" in
            v20.*|v22.*) echo "ok" ;;
            *) echo "::error::Unsupported Node version: $NODE_V (want v20.x or v22.x)"; exit 1 ;;
          esac
      # See the note on the verify job's install step: `npm ci`, not a re-resolve.
      - name: Install (npm ci, from the committed lockfile)
        run: npm ci --no-audit --no-fund
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  lockfile-sync:
    # M14: every OTHER install in CI regenerates the lockfile
    # (rm -f package-lock.json && npm install) to sidestep the npm optional-deps
    # platform bug — so the COMMITTED package-lock.json that release.yml:72 and
    # the Dockerfile `npm ci` against is exercised by ZERO pre-tag gates. A
    # package.json/lockfile desync then goes green in CI and red at tag time on
    # an already-pushed immutable tag. This cheap ubuntu leg runs the SAME
    # `npm ci` those release artifacts use, so a desync turns CI red BEFORE a tag
    # exists. --ignore-scripts keeps it fast (the verify matrix covers build/test);
    # npm ci checks package.json/lockfile sync before it would run any script.
    name: Lockfile in sync + tarball smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci against the committed lockfile (fails on desync)
        run: npm ci --ignore-scripts
      # F7: the tool-docs byte-diff runs HERE (not in the verify matrix) on
      # purpose — this is the only job installing against the committed
      # lockfile, so the zod that renders the JSON schemas is the pinned one.
      # A floating install could legally reorder JSON-schema output and turn
      # an untouched repo red.
      - name: Build (docgen reads schemas from dist)
        run: npm run build
      - name: Tool docs match a fresh docgen (schema change without regen fails)
        run: npm run gen:tool-docs:check

      # ── Tarball install-and-run smoke (F-c32cff48) ──────────────────────────
      # Nothing in CI installed the published artifact and ran the binary.
      # tests/pack.test.ts contract-tests the tarball's FILE LIST (required
      # paths present, forbidden prefixes absent, size envelope) and never
      # executes it, so a tarball that is internally consistent but missing a
      # file the CODE reaches for ships green. It did: `files` omitted
      # hermes.config.example.yaml while src/index.ts resolves
      # <bin-dir>/../hermes.config.example.yaml for the `init` verb advertised
      # in --help, so `init` answered every npm install with its own
      # "This is a packaging bug -- please report" error. Measured 2026-09-11:
      # this smoke goes RED on the pre-fix tarball (init exit 1) and GREEN on
      # the fixed one (init exit 0, 1840 bytes written).
      #
      # It rides HERE, in lockfile-sync, on purpose:
      #   * no new workflow (the repo is at 5 files against a cap of 2 for
      #     push-triggered ones) and no new job;
      #   * this job already checks out, `npm ci`s against the COMMITTED
      #     lockfile and builds, which is exactly the state a tarball is packed
      #     from -- so the smoke is ~40s of marginal cost, not a new leg;
      #   * it never invokes vitest. The four full-suite runs stay in `verify`.
      #
      # Zero egress beyond the npm registry: no OLLAMA_API_KEY (asserted
      # below), and OLLAMA_HOST is pointed at a port nothing listens on, so
      # every Ollama probe refuses instantly. `doctor` exits 0 when unhealthy
      # by design -- reporting is its job and --fail-unhealthy is the gate --
      # so the assertion is "the envelope parses and carries its keys", never
      # "healthy".
      - name: Pack the tarball a user would install
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          # --ignore-scripts: `prepack` is `clean && build`, which would wipe
          # the dist/ the previous two steps just produced and verified. The
          # tarball listing does not require prepack to run; tests/pack.test.ts
          # skips it for the same reason.
          TGZ="$(npm pack --ignore-scripts --silent | tail -n 1)"
          # Guard the --silent contract: if a future npm stops printing the
          # filename on stdout, fail here rather than mv-ing a bogus name.
          if [ -z "$TGZ" ] || [ ! -f "$TGZ" ]; then
            echo "::error::npm pack --silent did not name a tarball (got: '$TGZ')"
            exit 1
          fi
          mv "$TGZ" "$RUNNER_TEMP/$TGZ"
          echo "tarball=$RUNNER_TEMP/$TGZ" >> "$GITHUB_OUTPUT"
          echo "packed $TGZ into $RUNNER_TEMP"

      - name: Install the tarball and run the binary (no Ollama, no API key)
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          # Nothing listens on port 1, so every probe ECONNREFUSEs immediately.
          # Explicit rather than relying on "the runner happens to have no
          # Ollama" -- a future runner image with something on 11434 would
          # otherwise quietly turn this into a different test.
          OLLAMA_HOST: "http://127.0.0.1:1"
        run: |
          set -euo pipefail

          # The whole point of this gate is the no-key path. A secret mapped
          # into this job later would silently turn it into a cloud test.
          if [ -n "${OLLAMA_API_KEY:-}" ]; then
            echo "::error::OLLAMA_API_KEY is set in this job — the tarball smoke must prove the zero-egress, no-key path. Put cloud assertions in cloud-smoke instead."
            exit 1
          fi

          SMOKE="$RUNNER_TEMP/tarball-smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE/install" "$SMOKE/cwd"
          # Keep doctor's log lookup out of the runner's home dir.
          export INTERN_LOG_PATH="$SMOKE/log.ndjson"

          # Install what `npm i ollama-intern-mcp` installs: the packed tarball
          # plus its runtime deps, resolved fresh from the registry.
          cd "$SMOKE/install"
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund --loglevel=error "$TARBALL"

          # Through the bin shim, not `node dist/index.js` — the shim is what
          # proves package.json `bin` mapped and dist/index.js kept its shebang.
          BIN="$SMOKE/install/node_modules/.bin/ollama-intern-mcp"
          if [ ! -x "$BIN" ]; then
            echo "::error::bin shim missing or not executable at $BIN — package.json \"bin\" did not install."
            exit 1
          fi

          # 1. --version: it starts, and it agrees with the manifest it shipped from.
          WANT="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          GOT="$("$BIN" --version)"
          echo "--version: $GOT (manifest says $WANT)"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::installed binary reports $GOT but package.json says $WANT"
            exit 1
          fi

          # 2. --help: still advertises the verbs it advertises. `init` is
          #    listed here, which is what makes step 4 a contract and not a
          #    nice-to-have.
          "$BIN" --help > "$SMOKE/help.txt"
          for verb in init doctor; do
            if ! grep -qE "^[[:space:]]+$verb[[:space:]]" "$SMOKE/help.txt"; then
              echo "::error::--help no longer lists the $verb verb"
              exit 1
            fi
          done
          echo "--help: lists init + doctor"

          # 3. doctor --json: exit 0 and a parseable envelope. NOT healthy —
          #    there is no Ollama here, and this deliberately does not pass
          #    --fail-unhealthy.
          "$BIN" doctor --json > "$SMOKE/doctor.json"
          node -e '
            const fs = require("node:fs");
            const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const k of ["healthy", "profile", "ollama", "models", "paths", "warnings"]) {
              if (!(k in d)) {
                console.error("::error::doctor --json is missing the \"" + k + "\" key");
                process.exit(1);
              }
            }
            if (d.ollama.reachable !== false) {
              console.error("::error::doctor reports a reachable Ollama on a runner that has none — OLLAMA_HOST did not take effect, so this run proved nothing about the offline path");
              process.exit(1);
            }
            console.log("doctor --json: ok (healthy=" + d.healthy + ", reachable=" + d.ollama.reachable + ", warnings=" + d.warnings.length + ")");
          ' "$SMOKE/doctor.json"

          # 4. init: the assertion this gate exists for. It copies
          #    hermes.config.example.yaml out of the installed package root, so
          #    it goes red the moment that file stops shipping — the exact
          #    defect a file-list test cannot see.
          cd "$SMOKE/cwd"
          if ! "$BIN" init; then
            echo "::error::\`init\` failed from a real npm install. If it printed \"example config not found\", then hermes.config.example.yaml is missing from package.json \`files\` — that is exactly the defect this gate exists for (F-c32cff48); a file-list test cannot see it."
            exit 1
          fi
          if [ ! -s hermes.config.yaml ]; then
            echo "::error::init exited 0 but wrote no hermes.config.yaml"
            exit 1
          fi
          echo "init: wrote $(wc -c < hermes.config.yaml) bytes of hermes.config.yaml"

          echo "tarball smoke: OK — the published artifact installs and runs."

  docker-build:
    # H8: the release docker job now `needs: npm`, so a broken Dockerfile would
    # otherwise surface only AFTER npm already published. Prove the release
    # image BUILDS on every push/PR that could affect it — build only
    # (push: false); the real tagged push happens in release.yml.
    name: Release image builds (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # docker/* JS actions still ship Node 20 entrypoints (removed from runners
    # 2026-09-16); force them onto Node 24 as release.yml does.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image (no push)
        # Same pin as release.yml docker job (H8 pre-tag image gate).
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false

  # ── Cloud smoke (MANUAL ONLY) ──────────────────────────────────────────────
  # Smoke-tests the v2.7.0 opt-in cloud-routing path against the REAL Ollama
  # Cloud. Gated to `workflow_dispatch` so it NEVER runs on push/PR and never
  # spends cloud GPU quota automatically — an operator triggers it on demand.
  #
  # The OLLAMA_CLOUD repo secret (the API key) is mapped to OLLAMA_API_KEY at
  # the step level (the only place the `secrets` context is allowed). When the
  # secret is absent (forks, unconfigured repos) the step exits 0 with a notice
  # rather than failing — a missing key is "can't test here", not "broken".
  #
  # Cost: the doctor probe is a no-GPU /api/tags listing; the optional real
  # generate is a single ~8-token call (run_generate input, default on). Keep
  # it tiny.
  cloud-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: "npm"
      # See the note on the verify job's install step: `npm ci`, not a re-resolve.
      - name: Install (npm ci, from the committed lockfile)
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: "Cloud doctor probe (reachable: yes)"
        # Maps the OLLAMA_CLOUD secret → OLLAMA_API_KEY here (step-level env is
        # the only context where `secrets` is permitted). Skips gracefully when
        # the secret is absent.
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD }}
          OLLAMA_CLOUD_PRIMARY: "1"
        run: |
          set -euo pipefail
          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "::notice::OLLAMA_CLOUD secret not set (fork or unconfigured repo) — skipping cloud smoke test."
            exit 0
          fi
          # doctor exits 0 even when unhealthy (its job is to REPORT). Capture
          # the human-readable report and assert the Cloud (primary) block.
          node dist/index.js doctor | tee doctor.out
          echo "----------------------------------------"
          if ! grep -q "Cloud (primary):" doctor.out; then
            echo "::error::doctor output is missing the 'Cloud (primary)' block — cloud config was not loaded."
            exit 1
          fi
          # Extract just the Cloud block (header → next blank line) so we don't
          # accidentally match the local Ollama block's own 'reachable:' line.
          cloud_block="$(awk '/^Cloud \(primary\):/{f=1} f{print} /^$/{if(f)exit}' doctor.out)"
          echo "--- Cloud (primary) block ---"
          echo "$cloud_block"
          if ! echo "$cloud_block" | grep -q "reachable: yes"; then
            echo "::error::Cloud (primary) block does not report 'reachable: yes' — cloud host did not answer."
            exit 1
          fi
          echo "cloud-smoke (doctor): OK — Ollama Cloud is reachable."
      - name: Cloud generate (backend == cloud)
        # Optional, default on. The doctor probe only proves reachability (the
        # /api/tags listing does not gate on the key); this single tiny generate
        # proves the key is GOOD and the routing path actually serves from cloud.
        if: ${{ inputs.run_generate }}
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD }}
          OLLAMA_CLOUD_PRIMARY: "1"
        run: |
          set -euo pipefail
          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "::notice::OLLAMA_CLOUD secret not set — skipping real cloud generate."
            exit 0
          fi
          node scripts/cloud-smoke-generate.mjs
