name: Doc Drift

# --- Measured CI cost (dogfood-swarm SKILL item 8) --------------------------
# This job no longer runs the vitest suite (F-f613f553). Live pass count is
# produced fail-closed by ci.yml verify (ubuntu-latest × node 20). Remaining
# work is checkout + grep + node scripts/sync-doc-versions.mjs (builtins
# only; no npm ci / build / test). Re-measure after the first green run of
# this shape:
#   gh api repos/mcp-tool-shop-org/ollama-intern-mcp/actions/runs/<id>/jobs
# timeout-minutes is 5 as a ceiling, not a measurement.
# ---------------------------------------------------------------------------
#
# Catches the failure mode where docs and source-of-truth drift apart between
# releases — a CHANGELOG entry is missing for the package.json version, a
# release-notes file still says "Released: TBD" weeks after the tag, or the
# README's stated test count no longer matches the TEST_COUNT marker (live
# suite count is asserted in ci.yml). All three have shipped in past
# releases; this gate makes the next instance fail loudly in CI instead of
# silently going public.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "CHANGELOG.md"
      - "README.md"
      - "HANDOFF.md"
      - "CONTRIBUTING.md"
      - "SHIP_GATE.md"
      - "docs/release-notes/**"
      - "site/src/site-config.ts"
      - "site/src/content/docs/**"
      - "scripts/sync-doc-versions.mjs"
      - ".github/workflows/doc-drift.yml"
  pull_request:
    paths:
      - "package.json"
      - "CHANGELOG.md"
      - "README.md"
      - "HANDOFF.md"
      - "CONTRIBUTING.md"
      - "SHIP_GATE.md"
      - "docs/release-notes/**"
      - "site/src/site-config.ts"
      - "site/src/content/docs/**"
      - "scripts/sync-doc-versions.mjs"
      - ".github/workflows/doc-drift.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve package.json version
        id: pkg
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package.json version: $VERSION"

      # ----------------------------------------------------------------------
      # Check 1: CHANGELOG.md has an entry for the current package.json version.
      # The Keep-a-Changelog convention is `## [<version>] — YYYY-MM-DD`. We
      # only require the heading shape to exist; we don't enforce the date
      # format (the project keeps several historical-date variants).
      # ----------------------------------------------------------------------
      - name: Check CHANGELOG entry exists for current version
        shell: bash
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if ! grep -E "^## \[?${VERSION}\]?" CHANGELOG.md > /dev/null; then
            echo "::error file=CHANGELOG.md::No CHANGELOG entry found for version ${VERSION}. Expected a heading like '## [${VERSION}] — YYYY-MM-DD'."
            echo ""
            echo "Most recent CHANGELOG headings:"
            grep -E "^## " CHANGELOG.md | head -5 || true
            exit 1
          fi
          echo "ok — CHANGELOG entry found for v${VERSION}"

      # ----------------------------------------------------------------------
      # Check 2: docs/release-notes/*.md never ship with 'TBD' dates. A
      # release-notes file with 'Released: TBD' that's already on main is a
      # public artifact that says "we forgot." Catch it before merge.
      # ----------------------------------------------------------------------
      - name: Check release notes do not contain TBD dates
        shell: bash
        run: |
          if [ ! -d docs/release-notes ]; then
            echo "ok — no docs/release-notes/ directory"
            exit 0
          fi
          # Match 'Released: TBD' or 'Released:**TBD' or 'TBD' alone on a date line
          if grep -RnE "Released:\s*\*?\*?\s*TBD" docs/release-notes/; then
            echo "::error::Found 'Released: TBD' in docs/release-notes/. Replace with the actual release date before merge."
            exit 1
          fi
          echo "ok — no TBD dates in release notes"

      # ----------------------------------------------------------------------
      # Check 3: README / HANDOFF / SHIP_GATE stated test count matches the
      # TEST_COUNT HTML marker. Live suite measurement lives in ci.yml
      # verify (ubuntu-latest × node 20) — this job must not spawn
      # `npm test` and must not continue on a partial count (F-f613f553).
      # ----------------------------------------------------------------------
      - name: Check README/HANDOFF test count matches TEST_COUNT marker
        shell: bash
        run: |
          if [ ! -f HANDOFF.md ]; then
            echo "::error file=HANDOFF.md::HANDOFF.md missing; cannot resolve TEST_COUNT marker."
            exit 1
          fi
          ACTUAL="$(grep -oE '<!-- TEST_COUNT:start -->[0-9]+<!-- TEST_COUNT:end -->' HANDOFF.md | head -1 | grep -oE '[0-9]+' || true)"
          if [ -z "$ACTUAL" ]; then
            echo "::error file=HANDOFF.md::Could not parse TEST_COUNT marker."
            exit 1
          fi
          echo "Resolved TEST_COUNT marker: $ACTUAL"
          DRIFT=0

          # README: look for "<N> tests" or "<N> passing" near the badge / header.
          # We only scan files that are likely to make a load-bearing claim.
          for file in README.md HANDOFF.md SHIP_GATE.md; do
            if [ ! -f "$file" ]; then continue; fi
            # Match patterns like '792 tests', '792 passing', 'Tests: 792'.
            STATED="$(grep -oE '[0-9]{2,5}\s+(tests|passing)|Tests:\s*[0-9]{2,5}|tests:\s*[0-9]{2,5}' "$file" | head -3 || true)"
            if [ -z "$STATED" ]; then continue; fi
            while IFS= read -r line; do
              NUM="$(echo "$line" | grep -oE '[0-9]+')"
              if [ -z "$NUM" ]; then continue; fi
              if [ "$NUM" != "$ACTUAL" ]; then
                echo "::error file=$file::Stated test count '$line' (parsed: $NUM) does not match TEST_COUNT marker ($ACTUAL). Run 'npm run sync-docs' to refresh."
                DRIFT=1
              fi
            done <<< "$STATED"
          done

          if [ "$DRIFT" -ne 0 ]; then
            exit 1
          fi
          echo "ok — stated test counts match TEST_COUNT marker ($ACTUAL)"

      # ----------------------------------------------------------------------
      # Check 4: marker-level VERSION / TOOL_COUNT / TEST_COUNT + site-config
      # / handbook regex rewrites. Test count is the marker on docs-only
      # PRs; live pass count is asserted in ci.yml verify so this step never
      # spawns the suite (F-7df86b73).
      # ----------------------------------------------------------------------
      - name: Check doc version/count markers (sync-docs:check)
        shell: bash
        run: |
          COUNT="$(grep -oE '<!-- TEST_COUNT:start -->[0-9]+<!-- TEST_COUNT:end -->' HANDOFF.md | head -1 | grep -oE '[0-9]+' || true)"
          if [ -z "$COUNT" ]; then
            echo "::error file=HANDOFF.md::Could not parse TEST_COUNT marker for sync-docs:check."
            exit 1
          fi
          node scripts/sync-doc-versions.mjs --check --test-count="$COUNT"
