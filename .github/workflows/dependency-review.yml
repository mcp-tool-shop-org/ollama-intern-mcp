name: Dependency Review

# GitHub's dependency-review-action diffs the lockfile changes in a PR against
# the base branch and fails the check if any newly-introduced dependency has:
#   - a vulnerability at moderate severity or higher
#   - a license outside the permissive allowlist below
#
# This is the supply-chain gate that runs in the PR-review window — earlier
# than `npm audit` which only runs on main, and earlier than the CodeQL scan
# which only catches code-quality findings. Together they cover three failure
# modes (vulnerable new dep / license incompat / source-code CVE pattern).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # pull-requests: write — lets the action post a summary comment on the PR
  # describing what dependencies it found and what it would have blocked.
  # Without it the check still runs and gates merge, but the operator-facing
  # explanation only shows up in the Checks tab.
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency Review
        # v4 — current major. Pin tracks the same convention as CodeQL.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Severity floor. Any CVE at moderate / high / critical against a
          # newly-introduced dep fails the check. `low` would be too noisy;
          # `high` would miss meaningful moderates the project shouldn't
          # silently absorb.
          fail-on-severity: moderate
          # License allowlist — the project ships under MIT. Anything more
          # restrictive (GPL family, AGPL, SSPL) would create license-friction
          # for downstream consumers. The six listed cover the dominant
          # permissive-license surface in the npm ecosystem (BlueOak-1.0.0 is
          # the Blue Oak Council permissive license — MIT-class, no copyleft —
          # that isaacs' packages (lru-cache, glob, …) have migrated to).
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, ISC, Apache-2.0, BlueOak-1.0.0
          # Per-package license exemptions: astro 7's bundled sharp image
          # service pulls libvips platform binaries under LGPL-3.0-or-later.
          # These are BUILD-TIME tooling for the statically-prerendered site —
          # site dependencies ship in neither the npm tarball (`files`
          # allowlist) nor the Docker image, so nothing LGPL is redistributed
          # (SECURITY.md item 14). Version-independent purls; security
          # scanning still applies to every package listed here.
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64,
            pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm,
            pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64,
            pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x,
            pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64,
            pkg:npm/@img/sharp-wasm32,
            pkg:npm/@img/sharp-win32-arm64,
            pkg:npm/@img/sharp-win32-ia32,
            pkg:npm/@img/sharp-win32-x64
          # Post the PR comment so the operator sees the diff inline.
          comment-summary-in-pr: on-failure
